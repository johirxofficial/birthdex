services:
  birthdex:
    build: .
    image: birthdex:latest
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      CAPTCHA_TTL: "600"
      CAPTCHA_CAPACITY: "200"
      ALLOW_ORIGIN: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5002/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
