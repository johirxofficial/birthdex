name: Feature request
description: Suggest an improvement that fits the project's principles.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        BirthDex stays small on purpose. Please check
        [docs/GUIDELINES.md](https://github.com/johirxofficial/birthdex/blob/main/docs/GUIDELINES.md)
        before proposing large changes.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The captcha stays manual (no OCR or solving services).
          required: true
        - label: No personal data is stored, logged or cached to disk.
          required: true
        - label: No new runtime dependency unless clearly justified.
          required: true
