name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste a real birth/death record or a real
        registration number.** Replace digits and names with examples.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and short description of the problem.
      placeholder: I called /api/verify and ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, URLs and request bodies with personal data removed.
      placeholder: |
        1. Start with `birthdex --port 5002`
        2. GET /api/verify?type=birth&number=00000000000000000&dob=2000-01-01
        3. ...
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run BirthDex?
      options:
        - pip / pipx
        - Docker
        - run.bat
        - run.sh
        - python app.py from a source checkout
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or response body
      description: Redact personal data and tokens.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed all personal data from this report.
          required: true
        - label: This is not a request for OCR or automated captcha solving.
          required: true
