name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q birthdex app.py

      - name: Test
        run: python -m pytest

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install dist/*.whl
          /tmp/venv/bin/birthdex --version

      - name: Serve the packaged app
        run: |
          /tmp/venv/bin/python - <<'PY'
          from birthdex import create_app

          client = create_app().test_client()
          assert client.get("/").status_code == 200
          assert client.get("/static/app.css").status_code == 200
          assert client.get("/static/app.js").status_code == 200
          assert client.get("/health").status_code == 200
          print("packaged assets and health endpoint OK")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t birthdex:ci .

      - name: Run and check /health
        run: |
          docker run -d --name birthdex-ci -p 5002:5002 birthdex:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5002/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":true' /tmp/health.json

      - name: Logs on failure
        if: failure()
        run: docker logs birthdex-ci

      - name: Cleanup
        if: always()
        run: docker rm -f birthdex-ci || true
